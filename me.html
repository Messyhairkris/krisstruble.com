<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>This device · Kris Struble</title>
<style>
:root{--paper:#f0e1d5;--ink:#553d36;--accent:#426a5a}
@media (prefers-color-scheme:dark){:root{--paper:#2a201d;--ink:#f0e1d5;--accent:#9cc3b2}}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 system-ui,"Segoe UI",sans-serif}
main{max-width:520px;margin:12vh auto;padding:0 16px}
h1{font-size:24px;margin:0 0 12px}
button{font:inherit;padding:10px 18px;border:2px solid var(--accent);background:none;color:var(--accent);border-radius:8px;cursor:pointer}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Visit counting on this device</h1>
  <p id="state">Checking…</p>
  <p><button id="toggle" type="button">…</button></p>
  <p><a href="index.html">Back to the site</a></p>
</main>
<script>
var KEY = "umami.disabled";
function get(){ try { return localStorage.getItem(KEY) === "1"; } catch (e) { return null; } }
function render(){
  var off = get();
  document.getElementById("state").textContent =
    off === null ? "This browser is blocking storage, so it can't remember the setting." :
    off ? "This browser is NOT counted. Your visits here won't show up in the stats." :
          "This browser IS counted, like any visitor.";
  var b = document.getElementById("toggle");
  b.textContent = off ? "Count this browser again" : "Stop counting this browser";
  b.hidden = off === null;
}
document.getElementById("toggle").onclick = function(){
  try { get() ? localStorage.removeItem(KEY) : localStorage.setItem(KEY, "1"); } catch (e) {}
  render();
};
render();
</script>
</body>
</html>
